<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="contact-page">
    <nav
      data-testid="test-main-nav"
      aria-label="Main-Navigation"
      class="main-nav"
    >
      <ul>
        <li>
          <a href="index.html" data-testid="test-nav-profile">Profile</a>
        </li>
        <li>
          <a href="aboutme.html" data-testid="test-nav-about">About</a>
        </li>
        <li>
          <a href="contactus.html" data-testid="test-nav-contact">Contact</a>
        </li>
      </ul>
    </nav>

    <main>
      <section data-testid="test-contact-page">
        <h2 data-testid="test-contact-form-title">CONTACT US</h2>

        <form
          data-testid="test-contact-form"
          aria-label="Contact Form"
          novalidate
        >
          <!--Full Name Field-->
          <div class="form-group">
            <label for="name">Full Name: </label>
            <input
              type="text"
              id="name"
              data-testid="test-contact-name"
              aria-describedby="name-error"
              required
            />
            <small
              data-testid="test-contact-error-name"
              id="name-error"
              class="error hidden"
            ></small>
          </div>

          <!--Email Field-->
          <div class="form-group">
            <label for="email">Email: </label>
            <input
              type="email"
              id="email"
              data-testid="test-contact-email"
              aria-describedby="email-error"
              minlength="10"
              required
            />
            <small
              data-testid="test-contact-error-email"
              id="email-error"
              class="error hidden"
            ></small>
          </div>

          <!--Subject Field-->
          <div class="form-group">
            <label for="subject">Subject: </label>
            <input
              type="text"
              id="subject"
              data-testid="test-contact-subject"
              aria-describedby="subject-error"
              required
            />
            <small
              data-testid="test-contact-error-subject"
              id="subject-error"
              class="error hidden"
            ></small>
          </div>

          <!--Message Field-->
          <div class="form-group">
            <label for="message">Message: </label>
            <textarea
              id="message"
              data-testid="test-contact-message"
              aria-describedby="message-error"
              required
            ></textarea>
            <small
              data-testid="test-contact-error-message"
              id="message-error"
              class="error hidden"
            ></small>
          </div>

          <!--Submit Button-->
          <button type="submit" data-testid="test-contact-submit">
            Submit
          </button>
          <!--Success Message-->
          <p data-testid="test-contact-success" class="success hidden"></p>
        </form>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
